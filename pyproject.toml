[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard-ai"
version = "0.1.0"
description = "Local-first data-quality incident response prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "numpy>=2.1,<3.0",
    "opencv-python-headless>=4.10,<5.0",
    "joblib>=1.4,<2.0",
    "pydantic-settings[yaml]>=2.6,<3.0",
    "scikit-learn>=1.5,<2.0",
    "streamlit>=1.39,<2.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
